<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iris Classifier – MLOps</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Iris Classifier</h1>
    <p class="sub">Frontend → FastAPI → modèle scikit-learn (Docker)</p>
    <div id="status" class="status">Connexion à l'API…</div>
  </header>

  <main>
    <section class="card">
      <h2>1. Saisir les features</h2>
      <div class="presets">
        <span>Exemples :</span>
        <button type="button" data-preset="setosa">Setosa</button>
        <button type="button" data-preset="versicolor">Versicolor</button>
        <button type="button" data-preset="virginica">Virginica</button>
      </div>
      <form id="form">
        <div class="field">
          <label for="sepal_length">Longueur du sépale (cm)</label>
          <input type="range" id="sepal_length_r" min="4" max="8" step="0.1" value="5.1" />
          <input type="number" id="sepal_length" min="0" max="10" step="0.1" value="5.1" required />
        </div>
        <div class="field">
          <label for="sepal_width">Largeur du sépale (cm)</label>
          <input type="range" id="sepal_width_r" min="2" max="4.5" step="0.1" value="3.5" />
          <input type="number" id="sepal_width" min="0" max="10" step="0.1" value="3.5" required />
        </div>
        <div class="field">
          <label for="petal_length">Longueur du pétale (cm)</label>
          <input type="range" id="petal_length_r" min="1" max="7" step="0.1" value="1.4" />
          <input type="number" id="petal_length" min="0" max="10" step="0.1" value="1.4" required />
        </div>
        <div class="field">
          <label for="petal_width">Largeur du pétale (cm)</label>
          <input type="range" id="petal_width_r" min="0.1" max="2.5" step="0.1" value="0.2" />
          <input type="number" id="petal_width" min="0" max="10" step="0.1" value="0.2" required />
        </div>
        <button type="submit" class="primary">Prédire l'espèce</button>
      </form>
    </section>

    <section class="card">
      <h2>2. Résultat</h2>
      <div id="result" class="result muted">Aucune prédiction pour l'instant.</div>
      <div id="probas"></div>
    </section>

    <section class="card">
      <h2>3. Modèle en production</h2>
      <dl id="model-info" class="info muted"><dt>—</dt><dd>chargement…</dd></dl>
    </section>
  </main>

  <footer>TP MLOps · WSL2 · Git · Docker</footer>
  <script src="app.js"></script>
</body>
</html>
